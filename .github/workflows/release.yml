name: 🚀 Release & Chrome Web Store

# A tag push (vX.Y.Z) releases: validation, the build and its attested zip, the CHANGELOG notes, the GitHub
# Release with the zip attached, then, for a tag without -alpha, -beta or -rc, the Submission of that same zip to
# the Chrome Web Store, once the owner approves the chrome-webstore environment.
#
# A manual run (workflow_dispatch) is the rehearsal. Its version is package.json's. It runs the validation, the
# build and the attested zip, the extraction of the CHANGELOG notes and, on main only, one read-only status call
# to the store in the chrome-webstore environment. It creates no GitHub Release and submits nothing.
#
# Path and reruns: docs/RELEASE_WORKFLOW.md. Google Cloud, Developer Dashboard and GitHub setup:
# docs/GITHUB_ENVIRONMENTS.md.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Tag runs go one at a time. A rehearsal has its own group: GitHub keeps one pending run per group and cancels
# the one it replaces, so a rehearsal in the tag runs' group could cancel a tag run waiting there.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'release-rehearsal' || 'release-process' }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.x"
  CI: true
  FORCE_COLOR: 1

# Least privilege: every job reads the code, nothing more. A job that needs more asks for it.
permissions:
  contents: read

jobs:
  # Pre-release validation
  validate-release:
    name: 🔍 Release Validation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}
    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # A release never reads the Actions cache: an entry another run wrote
          # could end up in the published package (zizmor: cache-poisoning)
          package-manager-cache: false
          check-latest: false # Use cached version for speed
          registry-url: "https://registry.npmjs.org"

      - name: 📋 Extract Version Information
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # The rehearsal: the version is package.json's, so it never names another Release
            version=$(node -p "require('./package.json').version")
            is_prerelease="false"
          else
            # Tag push event
            version=${GITHUB_REF#refs/tags/v}
            # Detect pre-release from version string (contains -alpha, -beta, -rc)
            if [[ "$version" =~ -alpha|-beta|-rc ]]; then
              is_prerelease="true"
            else
              is_prerelease="false"
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is-prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

          echo "📦 Release Version: $version"
          echo "🏷️ Pre-release: $is_prerelease"

      - name: 📦 Install Dependencies
        run: |
          echo "🔧 Installing dependencies with performance optimizations..."
          npm ci --prefer-offline --no-audit --no-fund --silent

      - name: 🔍 Version Consistency Check
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          release_version="$RELEASE_VERSION"

          echo "📦 Package.json version: $package_version"
          echo "🏷️ Release version: $release_version"

          if [ "$package_version" != "$release_version" ]; then
            echo "❌ Version mismatch between package.json ($package_version) and release ($release_version)"
            echo "🔧 Please update package.json version to match the release tag"
            exit 1
          fi

          echo "✅ Version consistency verified"

      - name: 🧹 Quality Gates - Linting
        run: |
          echo "🧹 Running final lint check for release..."
          npm run lint

      - name: 🧪 Quality Gates - Testing
        run: |
          echo "🧪 Running complete test suite for release..."
          npm run test:coverage
        env:
          NODE_ENV: test

      - name: 🔒 Security Audit
        run: |
          echo "🔒 Final security audit for release..."
          node scripts/audit.mjs # npm audit at moderate, minus the waivers in the script

  # Production build for release: one zip, attested, attached to the GitHub Release and submitted to the store
  build-release:
    name: 🏗️ Release Build
    runs-on: ubuntu-latest
    needs: validate-release
    permissions:
      contents: read
      id-token: write # attest-build-provenance signs the zip's provenance with the job's OIDC token
      attestations: write # and stores the attestation in the repository
    outputs:
      zip: ${{ steps.package.outputs.zip }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # A release never reads the Actions cache: an entry another run wrote
          # could end up in the published package (zizmor: cache-poisoning)
          package-manager-cache: false
          check-latest: false # Use cached version for speed
          registry-url: "https://registry.npmjs.org"

      - name: 📦 Install Dependencies
        run: |
          echo "🔧 Installing dependencies with performance optimizations..."
          npm ci --prefer-offline --no-audit --no-fund --silent

      - name: 🏗️ Production Build
        run: |
          echo "🏗️ Creating optimized production build for release..."
          npm run build
        env:
          NODE_ENV: production
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}

      - name: 🔍 Build Verification
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          echo "🔍 Verifying release build..."

          # Verify essential files
          required_files=("dist/manifest.json" "dist/src/popup.html" "dist/src/sidepanel.html")
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
          done

          # Verify manifest version matches release
          manifest_version=$(node -p "require('./dist/manifest.json').version")
          release_version="$RELEASE_VERSION"

          if [ "$manifest_version" != "$release_version" ]; then
            echo "❌ Manifest version ($manifest_version) doesn't match release ($release_version)"
            exit 1
          fi

          echo "✅ Build verification passed"

      # The contents of dist/, manifest.json at the root as the store requires, from the build above: no npm
      # install and no second build (npm run package does both, so it stays for local use only).
      - name: 📦 Zip the Build
        id: package
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          zip_name="prompt-library-extension-v$RELEASE_VERSION.zip"
          (cd dist && zip -r -X -q "../$zip_name" .)

          # The listing is read whole first: grep -q would stop at the match, and under pipefail
          # the unzip it cut off would fail the test
          listing=$(unzip -Z1 "$zip_name")
          if ! grep -qx 'manifest.json' <<< "$listing"; then
            echo "❌ $zip_name has no manifest.json at its root"
            exit 1
          fi
          zipped_version=$(unzip -p "$zip_name" manifest.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          if [ "$zipped_version" != "$RELEASE_VERSION" ]; then
            echo "❌ The zipped manifest says $zipped_version, the release is $RELEASE_VERSION"
            exit 1
          fi

          sha256=$(sha256sum "$zip_name" | cut -d ' ' -f 1)
          echo "zip=$zip_name" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "✅ $zip_name: manifest.json $zipped_version at the root, sha256 $sha256"

      - name: 📊 Release Build Analysis
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          echo "📊 Release Build Analysis"
          echo "========================"
          echo "📦 Total build size: $(du -sh dist/ | cut -f1)"
          echo "📋 Extension package size: $(du -h "$ZIP" | cut -f1)"
          echo ""
          echo "📁 Build contents:"
          find dist/ -type f -exec sh -c 'echo "  $(basename "$1"): $(wc -c < "$1") bytes"' _ {} \;

      - name: 🔐 Generate Build Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.zip }}

      - name: 📤 Upload Release Build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-extension-release-v${{ needs.validate-release.outputs.version }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
          retention-days: 90
          # Enhanced security options
          compression-level: 6

  # The Release notes, from the version's section of CHANGELOG.md
  release-notes:
    name: 📝 Release Notes
    runs-on: ubuntu-latest
    needs: validate-release
    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📝 Extract Release Notes from CHANGELOG
        id: release-notes
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
          ZIP: prompt-library-extension-v${{ needs.validate-release.outputs.version }}.zip
        run: |
          echo "📝 Extracting release notes from CHANGELOG.md..."

          version="$RELEASE_VERSION"

          # Check if CHANGELOG.md exists
          if [ ! -f CHANGELOG.md ]; then
            echo "⚠️ CHANGELOG.md not found, generating basic release notes"
            cat > release-notes.md << EOF
          ## What's New in v$version

          See commit history for details.

          ## 📦 Installation

          ### Chrome Web Store (Recommended)
          Visit the Chrome Web Store listing (link will be available after store approval)

          ### Manual Installation
          1. Download the $ZIP file
          2. Extract the contents
          3. Open Chrome and navigate to chrome://extensions/
          4. Enable "Developer mode"
          5. Click "Load unpacked" and select the extracted folder

          ## 🐛 Bug Reports
          Please report issues at https://github.com/$GITHUB_REPOSITORY/issues
          EOF
          else
            # Extract the changelog section for this version
            echo "📋 Extracting changelog for version $version"

            # Find the section for this version in CHANGELOG.md
            # Format: ## [1.7.0] - 2025-10-21
            awk -v version="$version" '
              /^## \['$version'\]/ { found=1; print; next }
              /^## \[/ { if (found) exit }
              found { print }
            ' CHANGELOG.md | sed 's/^### Added/### ✨ Added/' | sed 's/^### Changed/### 🔄 Changed/' | sed 's/^### Fixed/### 🐛 Fixed/' | sed 's/^### Security/### 🔒 Security/' > changelog-excerpt.txt

            # Check if we found the changelog section
            if [ ! -s changelog-excerpt.txt ]; then
              echo "⚠️ Changelog section for v$version not found in CHANGELOG.md"
              echo "Using fallback release notes"
              cat > release-notes.md << EOF
          ## What's New in v$version

          See CHANGELOG.md for details.

          ## 📦 Installation

          ### Chrome Web Store (Recommended)
          Visit the Chrome Web Store listing

          ### Manual Installation
          1. Download and extract $ZIP
          2. Open chrome://extensions/
          3. Enable Developer mode
          4. Load unpacked extension

          ## 🐛 Bug Reports
          https://github.com/$GITHUB_REPOSITORY/issues
          EOF
            else
              # Create enhanced release notes with changelog
              cat > release-notes.md << EOF
          # 🚀 My Prompt Manager v$version

          $(cat changelog-excerpt.txt)

          ---

          ## 📦 Installation

          ### Chrome Web Store (Recommended)
          - Visit the [Chrome Web Store](https://chrome.google.com/webstore) listing
          - Click "Add to Chrome" to install
          - Extension will auto-update with new releases

          ### Manual Installation (Developer Mode)
          1. Download the \`$ZIP\` file from release assets
          2. Extract the ZIP file to a folder
          3. Open Chrome and navigate to \`chrome://extensions/\`
          4. Enable **Developer mode** (toggle in top-right corner)
          5. Click **Load unpacked** and select the extracted folder
          6. The extension should now appear in your browser toolbar

          ## 🔧 Technical Details

          - **Version**: $version
          - **Manifest Version**: 3
          - **Build Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Commit**: $GITHUB_SHA
          - **Node Version**: $NODE_VERSION

          ## 🛠️ Key Features

          - 📝 Popup interface for prompt management
          - 🤖 Content script integration with AI platforms (Claude, ChatGPT, Perplexity)
          - 💾 Secure local storage using Chrome Storage API
          - 🌓 Dark/light theme support with system preference detection
          - 📤 Export/import functionality for prompt libraries
          - 🔍 Advanced search and filtering
          - 🏷️ Category management and organization

          ## 🐛 Bug Reports & Feature Requests

          - **Issues**: [GitHub Issues](https://github.com/$GITHUB_REPOSITORY/issues)
          - **Discussions**: [GitHub Discussions](https://github.com/$GITHUB_REPOSITORY/discussions)
          - **Security**: Report via [Security Advisory](https://github.com/$GITHUB_REPOSITORY/security/advisories/new)

          ## 📚 Documentation

          - [Installation Guide](https://github.com/$GITHUB_REPOSITORY#installation)
          - [User Guide](https://github.com/$GITHUB_REPOSITORY#usage)
          - [Contributing](https://github.com/$GITHUB_REPOSITORY/blob/main/CONTRIBUTING.md)
          - [Changelog](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)
          EOF
            fi
          fi

          echo "✅ Release notes prepared"
          echo ""
          echo "Preview:"
          echo "========================================"
          head -30 release-notes.md
          echo "========================================"

      - name: 📤 Upload Release Notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes-v${{ needs.validate-release.outputs.version }}
          path: release-notes.md
          if-no-files-found: error
          retention-days: 90

  # Create GitHub release with assets. A tag push only: the rehearsal creates and changes no Release.
  create-github-release:
    name: 🏷️ GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-release, build-release, release-notes]
    if: github.event_name == 'push'
    permissions:
      contents: write # create the release and upload its asset
    steps:
      # One zip per Release. "Re-run all jobs" builds a new zip (zip stores the files' times); this step stops that
      # run, so the Submission never sends the new zip while the Release keeps the first. Use "Re-run failed jobs".
      # It decides from one REST listing of the Releases, drafts included (softprops creates the Release as a
      # draft, attaches the zip, then publishes it), and compares the digest GitHub computed at the upload. A
      # failed call fails the step: an error is never read as "no Release yet". An asset without a digest, or with
      # an empty one, fails.
      - name: 🔒 Check the Release holds no other zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.validate-release.outputs.version }}
          ZIP: ${{ needs.build-release.outputs.zip }}
          SHA256: ${{ needs.build-release.outputs.sha256 }}
        run: |
          if ! digests=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == env.TAG) | .assets[] | select(.name == env.ZIP) | .digest | if (. // "") == "" then "none" else . end'); then
            echo "::error::Could not list the GitHub Releases, so whether $TAG already holds a $ZIP is unknown. Nothing was changed: Re-run failed jobs."
            exit 1
          fi
          if [ -z "$digests" ]; then
            echo "The GitHub Release of $TAG holds no $ZIP yet."
            exit 0
          fi
          if [ "$digests" != "sha256:$SHA256" ]; then
            echo "::error::The GitHub Release of $TAG already holds another $ZIP (${digests//$'\n'/, }), not this run's (sha256:$SHA256). Either a Re-run all jobs built a new zip: rerun a tag run with Re-run failed jobs only; or an earlier upload was cut off, leaving an empty $ZIP: delete it, then Re-run failed jobs; or $TAG has a second Release, such as a leftover draft: delete the leftover, then Re-run failed jobs (docs/RELEASE_WORKFLOW.md, Troubleshooting)."
            exit 1
          fi
          echo "The GitHub Release of $TAG already holds this run's $ZIP."

      - name: 📤 Download Release Build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chrome-extension-release-v${{ needs.validate-release.outputs.version }}
          path: ./release-assets

      - name: 📤 Download Release Notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes-v${{ needs.validate-release.outputs.version }}
          path: ./release-notes

      - name: 🏷️ Create GitHub Release
        id: create-release
        # zizmor: ignore[superfluous-actions] kept on purpose: unlike gh release create, it updates the release when the tag already has one, and uploads the asset in the same step
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ needs.validate-release.outputs.version }}
          name: 🚀 My Prompt Manager v${{ needs.validate-release.outputs.version }}
          body_path: ./release-notes/release-notes.md
          draft: false
          prerelease: ${{ needs.validate-release.outputs.is-prerelease }}
          # The attested zip under its real name; a name that matches no file fails the step
          files: ./release-assets/${{ needs.build-release.outputs.zip }}
          fail_on_unmatched_files: true
          # A rerun keeps the zip the first step checked; the default (true) deletes it, then uploads it again
          overwrite_files: false
          token: ${{ secrets.GITHUB_TOKEN }}

  # The rehearsal's read-only call to the store. On main only: the chrome-webstore environment admits main and
  # tags v*, so a manual run on another branch skips this job and runs everything else.
  chrome-web-store-status:
    name: 🔎 Chrome Web Store Status
    runs-on: ubuntu-latest
    needs: [validate-release, build-release]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: chrome-webstore # the owner approves each run
    permissions:
      contents: read
      id-token: write # google-github-actions/auth trades the job's OIDC token for a Google access token
    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false # see build-release: a release never reads the Actions cache

      - name: 📤 Download Release Build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chrome-extension-release-v${{ needs.validate-release.outputs.version }}
          path: ./release-assets

      - name: 🔐 Check the Zip Is the Attested One
        env:
          ZIP: release-assets/${{ needs.build-release.outputs.zip }}
          SHA256: ${{ needs.build-release.outputs.sha256 }}
        run: echo "$SHA256  $ZIP" | sha256sum --check --strict

      - name: 🔍 Check the Store Variables
        env:
          CWS_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          missing=""
          for name in CWS_WORKLOAD_IDENTITY_PROVIDER CWS_SERVICE_ACCOUNT CWS_PUBLISHER_ID CWS_EXTENSION_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Repository variables not set:$missing. The setup is in docs/GITHUB_ENVIRONMENTS.md."
            exit 1
          fi

      # Workload Identity Federation: no store secret in GitHub. This step asks for the read-only scope, enough for
      # fetchStatus. It limits this token, not the identity: code run by this job could mint a token with the
      # publishing scope from the same service account, so approving this job trusts main's code as a Submission does.
      - name: 🔑 Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore.readonly
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false

      - name: 🔎 Read the Store Status
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          ZIP: release-assets/${{ needs.build-release.outputs.zip }}
        run: node scripts/chrome-web-store.mjs status --zip "$ZIP"

  # The Submission: the attested zip, uploaded and submitted for Store review, published as soon as the Store
  # review approves it. Only the push of a tag without -alpha, -beta or -rc; never a manual run.
  chrome-web-store-submission:
    name: 🚀 Chrome Web Store Submission
    runs-on: ubuntu-latest
    needs: [validate-release, build-release, create-github-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.validate-release.outputs.is-prerelease == 'false'
    environment: chrome-webstore # the owner approves each run
    permissions:
      contents: read
      id-token: write # google-github-actions/auth trades the job's OIDC token for a Google access token
    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false # see build-release: a release never reads the Actions cache

      - name: 📤 Download Release Build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chrome-extension-release-v${{ needs.validate-release.outputs.version }}
          path: ./release-assets

      - name: 🔐 Check the Zip Is the Attested One
        env:
          ZIP: release-assets/${{ needs.build-release.outputs.zip }}
          SHA256: ${{ needs.build-release.outputs.sha256 }}
        run: echo "$SHA256  $ZIP" | sha256sum --check --strict

      - name: 🔍 Check the Store Variables
        env:
          CWS_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          missing=""
          for name in CWS_WORKLOAD_IDENTITY_PROVIDER CWS_SERVICE_ACCOUNT CWS_PUBLISHER_ID CWS_EXTENSION_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Repository variables not set:$missing. The setup is in docs/GITHUB_ENVIRONMENTS.md."
            exit 1
          fi

      # Workload Identity Federation: no store secret in GitHub. upload and publish need the chromewebstore scope.
      - name: 🔑 Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 1200s
          create_credentials_file: false
          export_environment_variables: false

      # Fails red with Google's message in the job summary; a rerun for a version already submitted or published
      # sends nothing and ends green. It never cancels a Submission.
      - name: 🚀 Submit to the Chrome Web Store
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          ZIP: release-assets/${{ needs.build-release.outputs.zip }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: node scripts/chrome-web-store.mjs submit --zip "$ZIP" --version "$RELEASE_VERSION"

  # Release summary: one row per job. A skipped job is expected (the GitHub Release and the Submission on a
  # rehearsal, the status call on a tag push or off main); a failed or cancelled one fails the run.
  release-summary:
    name: 📊 Release Summary
    runs-on: ubuntu-latest
    needs:
      - validate-release
      - build-release
      - release-notes
      - create-github-release
      - chrome-web-store-status
      - chrome-web-store-submission
    if: always()
    steps:
      - name: 📊 Release Process Summary
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
          IS_PRERELEASE: ${{ needs.validate-release.outputs.is-prerelease }}
          ZIP: ${{ needs.build-release.outputs.zip }}
          VALIDATE: ${{ needs.validate-release.result }}
          BUILD: ${{ needs.build-release.result }}
          NOTES: ${{ needs.release-notes.result }}
          GITHUB_RELEASE: ${{ needs.create-github-release.result }}
          STORE_STATUS: ${{ needs.chrome-web-store-status.result }}
          STORE_SUBMISSION: ${{ needs.chrome-web-store-submission.result }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            run_kind="Rehearsal"
          else
            run_kind="Release"
          fi

          {
            echo "## 📊 $run_kind v$RELEASE_VERSION"
            echo ""
            echo "- **Commit**: $GITHUB_SHA"
            echo "- **Pre-release**: $IS_PRERELEASE"
            echo "- **Zip**: ${ZIP:-none} (artifact \`chrome-extension-release-v$RELEASE_VERSION\`)"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| 🔍 Validation | $VALIDATE |"
            echo "| 🏗️ Build and attested zip | $BUILD |"
            echo "| 📝 Release notes | $NOTES |"
            echo "| 🏷️ GitHub Release | $GITHUB_RELEASE |"
            echo "| 🔎 Chrome Web Store status | $STORE_STATUS |"
            echo "| 🚀 Chrome Web Store Submission | $STORE_SUBMISSION |"
            echo ""
          } | tee -a "$GITHUB_STEP_SUMMARY"

          for result in "$VALIDATE" "$BUILD" "$NOTES" "$GITHUB_RELEASE" "$STORE_STATUS" "$STORE_SUBMISSION"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "❌ $run_kind v$RELEASE_VERSION failed: see the jobs above" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          echo "✅ $run_kind v$RELEASE_VERSION completed" | tee -a "$GITHUB_STEP_SUMMARY"
