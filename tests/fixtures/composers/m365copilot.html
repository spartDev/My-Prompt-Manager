  empty divs, a div holding an svg and a div with the plus menu, and a span with the dictation
  button. There is no send button while the field is empty, and the plus menu and dictation
  button render after the editor. The capture needs a profile signed in with a work account; replace
  this file with a capture of the live composer (npm run composers:capture -- --login once, then
  npm run composers:capture -- --only m365copilot).
  The Fluent composer of m365.cloud.microsoft that this file held before is checked in
  src/content/core/__tests__/icon-placement-chains.test.ts.
  Sanitized as scripts/composers/sanitize.ts writes a capture: of the attributes, only
  contenteditable, role and type of the web platform's values, and what the Platform's selectors
  read, with the selector's value, and without the wrappers that hold nothing the selectors read
  (the plus menu's div, the dictation button's span, the nested empty divs).
-->
