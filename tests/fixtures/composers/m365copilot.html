<!--
  Microsoft 365 Copilot composer at copilot.cloud.microsoft/chat: NOT CAPTURED. Written by hand on
  2026-11-15 (ticket My-Prompt-Manager-axv) from what was read on the live page, signed in with a
  work account, where m365.cloud.microsoft/chat and copilot.microsoft.com redirect such an account:
  the Lexical editor (data-lexical-editor, role="textbox", aria-label "Message Copilot"), the
  composer's test ids (PlusMenuButton, grounding-menu, peek-pivot-files, bebop-lite-content-below)
  and its buttons by ARIA label ("Add and manage sources", "Start dictation", "Open prompt gallery",
  five with none). Read again on the live page on 2026-11-18 (ticket My-Prompt-Manager-14v), signed
  in with a work account and an empty draft: the composer is the div
  .fai-BebopLiteChatInput__inputWrapper, a grid of three columns (contentBefore, input, actions)
  under a row for attachments. Its children, in order: the attachments div; the editor's span
  (.fai-EditorInput), which holds the editor and its placeholder span; the capabilities div, empty
  divs; the contentBefore div, an svg and the block div that holds the plus menu; and the span
  .fai-BebopLiteChatInput__actions with the dictation button. With text in the draft, the send
  button (type="submit", "Send") comes after the dictation button in that span. A button put after
  the plus menu, in its block div, went to a second line under the "+" and widened the column,
  which pushed the field right. The plus menu and dictation button render after the editor. The
  capture needs a profile signed in with a work account; replace this file with a capture of the
  live composer (npm run composers:capture -- --login once, then
  npm run composers:capture -- --only m365copilot).
  The Fluent composer of m365.cloud.microsoft that this file held before is checked in
  src/content/core/__tests__/icon-placement-chains.test.ts.
  Sanitized as scripts/composers/sanitize.ts writes a capture: of the attributes, only
  contenteditable, role and type of the web platform's values, and what the Platform's selectors
  read, with the selector's value; of the class names, only those the selectors name; the
  wrappers that hold nothing the selectors read folded (the capabilities' nested empty divs), the
  ones an anchor finds kept (the plus menu's div).
-->
<div>
  <div></div>
  <span>
    <span contenteditable="true" data-lexical-editor="true" role="textbox"><p><br></p></span>
    <span></span>
  </span>
  <div></div>
  <div>
    <svg></svg>
    <div>
      <button type="button" data-testid="PlusMenuButton"></button>
    </div>
  </div>
  <span class="fai-BebopLiteChatInput__actions">
    <button type="button"></button>
  </span>
</div>
