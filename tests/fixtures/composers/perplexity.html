<!--
  Perplexity composer, captured from www.perplexity.ai on 2026-11-11, home page, empty draft. The
  editor is Lexical now, not the textarea the config's selectors name.
  Sanitized: text, classes, generated ids, styles and SVG content removed; wrappers with no
  attribute and one child folded into that child.
-->
<div>
  <div>
    <div aria-label="Type / for search modes" contenteditable="true" role="textbox" data-lexical-editor="true"><p><br></p></div>
    <div>
      <button aria-label="Add files, plugins, and more" type="button"></button>
      <div>
        <div data-testid="ask-input-mode-toggle-indicator"></div>
        <span data-testid="ask-input-mode-toggle-width-wrapper"><button aria-label="Search" type="button"><span data-testid="ask-input-mode-toggle-chevron-slot"></span></button></span>
        <span data-testid="ask-input-mode-toggle-width-wrapper"><button aria-label="Computer" type="button"><span data-testid="ask-input-mode-toggle-chevron-slot"></span></button></span>
      </div>
    </div>
    <div>
      <button aria-haspopup="menu" aria-label="Model" type="button"></button>
      <button aria-label="Dictation" type="button"></button>
      <button aria-label="Use voice mode" type="button"></button>
    </div>
  </div>
</div>
