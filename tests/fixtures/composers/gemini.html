<!--
  Gemini composer, captured from gemini.google.com/app on 2026-11-11, signed in, French locale:
  the ARIA labels follow the user's language, the custom elements and the semantic class names
  do not. Sanitized: text, utility classes, generated ids, styles and icons removed; wrappers with
  no attribute and one child folded into that child.
-->
<input-area-v2>
  <fieldset role="none" class="input-area-fieldset">
    <div class="text-input-field">
      <div class="leading-actions-wrapper">
        <simplified-input-menu>
          <div>
            <gem-icon-button type="onSurface"><button aria-haspopup="menu" aria-label="Importation et outils"></button></gem-icon-button>
            <toolbox-drawer></toolbox-drawer>
          </div>
        </simplified-input-menu>
      </div>
      <div class="text-input-field-main-area">
        <div class="text-input-field_textarea-inner">
          <div>
            <rich-textarea class="text-input-field_textarea" aria-haspopup="menu">
              <div class="ql-editor ql-blank" contenteditable="true" role="textbox" aria-label="Saisissez un prompt pour Gemini" data-placeholder="Ask"><p><br></p></div>
            </rich-textarea>
            <at-mentions-menu-v2></at-mentions-menu-v2>
          </div>
        </div>
      </div>
      <div class="trailing-actions-wrapper">
        <bard-mode-switcher>
          <div role="group">
            <button class="input-area-switch" type="button" aria-label="Ouvrir le sélecteur de mode, actuellement Pro" aria-haspopup="true"><div class="input-area-switch-label"></div></button>
          </div>
        </bard-mode-switcher>
        <div class="input-buttons-wrapper-bottom">
          <speech-dictation-mic-button>
            <gem-icon-button type="onSurface"><button aria-label="Dicter (⌘⇧D)"></button></gem-icon-button>
          </speech-dictation-mic-button>
        </div>
      </div>
    </div>
  </fieldset>
</input-area-v2>
