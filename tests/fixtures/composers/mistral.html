<!--
  Mistral Le Chat composer, captured from chat.mistral.ai/chat on 2026-11-11, signed out. The
  submit button is hidden while the draft is empty; the mode button ("Fast") has no label.
  Sanitized: text, classes (but the editor's), generated ids, styles and SVG content removed;
  wrappers with no attribute and one child folded into that child.
-->
<form>
  <div>
    <button aria-label="Open settings menu" type="button"></button>
    <div>
      <button type="submit" hidden></button>
      <div class="ProseMirror" contenteditable="true" translate="no"><p data-placeholder="Ask"><br></p></div>
    </div>
    <div>
      <button type="button"></button>
      <button aria-label="Voice Mode" type="button"></button>
    </div>
  </div>
</form>
